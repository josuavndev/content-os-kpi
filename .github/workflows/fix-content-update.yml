name: Fix Content Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-content-update.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch content loading and update identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Show data immediately after session restore instead of waiting for the second refresh effect.
          old = "await backendService._loadData();"
          new = """const initialData = await backendService._loadData();
          setContentList(initialData.content || []);
          setUsers([...backendService.users]);
          setConfig({ ...backendService.config });
          if (backendService.lastSynced) {
            setLastSyncTime(backendService.lastSynced.toLocaleTimeString());
          }"""
          if old in text and 'const initialData = await backendService._loadData();' not in text:
              text = text.replace(old, new, 1)

          # Preserve the spreadsheet row identity when opening an existing content item.
          old = "content_id: content.content_id || content.contentId || ''"
          new = "content_id: content.content_id || content.contentId || '',\n  row_number: content.row_number || content.rowNumber || ''"
          if old in text and 'row_number: content.row_number || content.rowNumber ||' not in text:
              text = text.replace(old, new, 1)

          # Make saveContent send both the nested content object and stable row/id fields.
          old = """const data = await this._post({
    action: 'saveContent',
    content: contentData
  });"""
          new = """const data = await this._post({
    action: 'saveContent',
    content: contentData,
    row_number: contentData.row_number || contentData.rowNumber || '',
    content_id: contentData.content_id || contentData.contentId || ''
  });"""
          if old in text:
              text = text.replace(old, new, 1)

          # Frontend optimistic replacement must match by row_number as well as content_id.
          old = """const existingIndex = prev.findIndex(
        item =>
          item.content_id === updated.content_id ||
          item.content_id === updated.contentId
      );"""
          new = """const existingIndex = prev.findIndex(item => {
        const sameRow = updated.row_number && item.row_number && String(item.row_number) === String(updated.row_number);
        const sameId = updated.content_id && item.content_id && String(item.content_id) === String(updated.content_id);
        const sameAlias = updated.contentId && item.contentId && String(item.contentId) === String(updated.contentId);
        return sameRow || sameId || sameAlias;
      });"""
          if old in text:
              text = text.replace(old, new, 1)

          # New content gets a temporary frontend id, but existing rows never fall through to append.
          old = """const contentId =
    updated.content_id ||
    updated.contentId ||
    `temp-${Date.now()}`;"""
          new = """const contentId =
    updated.content_id ||
    updated.contentId ||
    (updated.row_number ? `row-${updated.row_number}` : `temp-${Date.now()}`);"""
          if old in text:
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve content row identity on edits"
          git push
