name: Optimize Save UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-save-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch bulk delete paint
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = """        const idsToDelete = [...selectedIds];
        setHiddenIds(idsToDelete);
        setSelectedIds([]);
        onExitBulkDeleteMode();
        showToast('Content sedang dihapus...', 'info');

        try {
for (const rowNumber of [...selectedIds].sort((a, b) => b - a)) {
  await backendService.deleteContent(
    currentUser,
    rowNumber
  );
}

          showToast('Content terpilih berhasil dihapus!', 'success');
          refreshData().finally(() => setHiddenIds([]));"""

          new = """        const idsToDelete = [...selectedIds];

        // Paksa tabel langsung repaint sebelum request delete berjalan.
        flushSync(() => {
          setHiddenIds(idsToDelete);
          setSelectedIds([]);
          onExitBulkDeleteMode();
        });
        showToast('Content sedang dihapus...', 'info');

        setTimeout(async () => {
          try {
            for (const rowNumber of [...idsToDelete].sort((a, b) => b - a)) {
              await backendService.deleteContent(
                currentUser,
                rowNumber
              );
            }

            showToast('Content terpilih berhasil dihapus!', 'success');
            refreshData().finally(() => setHiddenIds([]));
          } catch (err) {
            setHiddenIds([]);
            await refreshData();
            showToast(err.message, 'error');
          }
        }, 0);
        return;"""

          if new not in text:
              if old not in text:
                  raise SystemExit('bulk delete handler block not found')
              text = text.replace(old, new, 1)

          old_catch = """        } catch (err) {
          setHiddenIds([]);
          await refreshData();
          showToast(err.message, 'error');
        }
      }}"""
          if old_catch in text:
              text = text.replace(old_catch, "      }}", 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Patch initial data load deduplication
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          ctor_old = """    this.currentUser = null;
    this.token = null;
  }"""
          ctor_new = """    this.currentUser = null;
    this.token = null;
    this._dataCache = null;
    this._loadPromise = null;
  }"""
          if ctor_new not in text:
              if ctor_old not in text:
                  raise SystemExit('backend constructor block not found')
              text = text.replace(ctor_old, ctor_new, 1)

          start = text.find("  async _loadData() {")
          end = text.find("\n  async getSharedCalendar(", start)
          if start < 0 or end < 0:
              raise SystemExit('_loadData boundaries not found')

          new_method = r'''  async _loadData(force = false) {
    if (!this.token) {
      throw new Error('401 Unauthorized: Token tidak ditemukan');
    }

    // Semua request data awal (calendar + KPI) memakai satu hasil load yang sama.
    // Ini mencegah 3 request Google Sheets bersamaan setelah login.
    if (!force && this._dataCache) {
      return this._dataCache;
    }

    if (!force && this._loadPromise) {
      return this._loadPromise;
    }

    const loadPromise = (async () => {
      const data = await this._post({
        action: 'getData',
        token: this.token
      });

      const result = data.data || {};

      this.users = result.users || [];
      this.content = result.content || [];
      this.config = Array.isArray(result.kpiConfig)
        ? {
            monthlyContentTarget: Number(result.kpiConfig.find(k => k.kpi_id === 'KPI001')?.target) || INITIAL_CONFIG.monthlyContentTarget,
            dailyStoryTarget: Number(result.kpiConfig.find(k => k.kpi_id === 'KPI002')?.target) || INITIAL_CONFIG.dailyStoryTarget,
            views100kTarget: Number(result.kpiConfig.find(k => k.kpi_id === 'KPI003')?.target) || INITIAL_CONFIG.views100kTarget,
            h3SubmissionDays: Number(result.kpiConfig.find(k => k.kpi_id === 'KPI004')?.target) || INITIAL_CONFIG.h3SubmissionDays,
            unexpectedMaxDays: Number(result.kpiConfig.find(k => k.kpi_id === 'KPI005')?.target) || INITIAL_CONFIG.unexpectedMaxDays,
            views100kThreshold: Number(result.kpiConfig.find(k => k.kpi_id === 'KPI006')?.target) || INITIAL_CONFIG.views100kThreshold,
            optimalReelsCoverRate: Number(result.kpiConfig.find(k => k.kpi_id === 'KPI007')?.target) || INITIAL_CONFIG.optimalReelsCoverRate,
            weights: {
              process: Number(result.kpiConfig.find(k => k.kpi_id === 'KPI008')?.target) || INITIAL_CONFIG.weights.process,
              output: Number(result.kpiConfig.find(k => k.kpi_id === 'KPI009')?.target) || INITIAL_CONFIG.weights.output,
              outcome: Number(result.kpiConfig.find(k => k.kpi_id === 'KPI010')?.target) || INITIAL_CONFIG.weights.outcome
            }
          }
        : result.kpiConfig || INITIAL_CONFIG;
      this.lastSynced = new Date();
      return result;
    })();

    this._loadPromise = loadPromise;

    try {
      const result = await loadPromise;
      this._dataCache = result;
      return result;
    } finally {
      if (this._loadPromise === loadPromise) {
        this._loadPromise = null;
      }
    }
  }
'''
          text = text[:start] + new_method + text[end:]

          # Mutations invalidate the cached dataset so the next refresh fetches fresh Sheets data.
          save_old = """    if (data.status !== 'ok') {
      throw new Error(
        data.message || 'Gagal menyimpan content'
      );
    }

    return data;
}"""
          save_new = """    if (data.status !== 'ok') {
      throw new Error(
        data.message || 'Gagal menyimpan content'
      );
    }

    this._dataCache = null;
    return data;
}"""
          if save_new not in text:
              if save_old not in text:
                  raise SystemExit('saveContent success block not found')
              text = text.replace(save_old, save_new, 1)

          delete_old = """    if (data.status !== 'ok') {
      throw new Error(
        data.message || 'Gagal menghapus content'
      );
    }

    return data;
}
  async saveConfig"""
          delete_new = """    if (data.status !== 'ok') {
      throw new Error(
        data.message || 'Gagal menghapus content'
      );
    }

    this._dataCache = null;
    return data;
}
  async saveConfig"""
          if delete_new not in text:
              if delete_old not in text:
                  raise SystemExit('deleteContent success block not found')
              text = text.replace(delete_old, delete_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "perf: dedupe initial data loading after login"
          git push