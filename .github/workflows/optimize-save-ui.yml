name: Optimize Save UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-save-ui.yml'

permissions:
  contents: write

jobs:
  patch-save-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch save handler
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = "  // Paksa React commit perubahan optimistis ke DOM sebelum request backend."
          if marker not in text:
              raise SystemExit('Duplicate optimistic save block not found')

          start = text.find("  setContentList(prev => {", text.find("const optimisticContent = {"))
          end = text.find(marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate first optimistic setContentList block')

          text = text[:start] + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: remove duplicate optimistic save render"
          git push