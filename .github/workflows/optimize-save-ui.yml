name: Optimize Save UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-save-ui.yml'

permissions:
  contents: write

jobs:
  patch-save-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch save handler
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '''  backendService.saveContent(currentUser, updated)\n    .then(() => {\n      showToast('Konten berhasil disimpan & KPI diperbarui!', 'success');\n\n      // Sync dengan backend setelah UI sudah terasa instan\n      setTimeout(() => {\n        refreshData();\n      }, 1500);\n    })\n    .catch((err) => {\n      showToast(err.message, 'error');\n      refreshData();\n    });'''

          new = '''  // Beri browser satu frame untuk paint UI optimistis terlebih dahulu.\n  requestAnimationFrame(() => {\n    backendService.saveContent(currentUser, updated)\n      .then(() => {\n        showToast('Konten berhasil disimpan & KPI diperbarui!', 'success');\n\n        // Sync setelah request backend selesai, tanpa menahan render UI.\n        refreshData();\n      })\n      .catch((err) => {\n        showToast(err.message, 'error');\n        refreshData();\n      });\n  });'''

          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one save handler, found {text.count(old)}')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "perf: paint optimistic save UI before backend"
          git push