name: Optimize Save UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-save-ui.yml'

permissions:
  contents: write

jobs:
  patch-save-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch bulk delete paint
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          state_old = "  const [hiddenIds, setHiddenIds] = useState([]);\n"
          state_new = state_old
          if state_old not in text:
              raise SystemExit('hiddenIds state not found')

          old = """        const idsToDelete = [...selectedIds];\n        setHiddenIds(idsToDelete);\n        setSelectedIds([]);\n        onExitBulkDeleteMode();\n        showToast('Content sedang dihapus...', 'info');\n\n        try {\nfor (const rowNumber of [...selectedIds].sort((a, b) => b - a)) {\n  await backendService.deleteContent(\n    currentUser,\n    rowNumber\n  );\n}\n\n          showToast('Content terpilih berhasil dihapus!', 'success');\n          refreshData().finally(() => setHiddenIds([]));"""

          new = """        const idsToDelete = [...selectedIds];\n\n        // Paksa tabel langsung repaint sebelum request delete berjalan.\n        flushSync(() => {\n          setHiddenIds(idsToDelete);\n          setSelectedIds([]);\n          onExitBulkDeleteMode();\n        });\n        showToast('Content sedang dihapus...', 'info');\n\n        setTimeout(async () => {\n          try {\n            for (const rowNumber of [...idsToDelete].sort((a, b) => b - a)) {\n              await backendService.deleteContent(\n                currentUser,\n                rowNumber\n              );\n            }\n\n            showToast('Content terpilih berhasil dihapus!', 'success');\n            refreshData().finally(() => setHiddenIds([]));\n          } catch (err) {\n            setHiddenIds([]);\n            await refreshData();\n            showToast(err.message, 'error');\n          }\n        }, 0);\n        return;"""

          if new not in text:
              if old not in text:
                  raise SystemExit('bulk delete handler block not found')
              text = text.replace(old, new, 1)

          # Remove the now-duplicated outer catch block left by the original handler.\n          old_catch = """        } catch (err) {\n          setHiddenIds([]);\n          await refreshData();\n          showToast(err.message, 'error');\n        }\n      }}"""
          if old_catch in text:
              text = text.replace(old_catch, "      }}", 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "perf: paint bulk delete UI before backend requests"
          git push