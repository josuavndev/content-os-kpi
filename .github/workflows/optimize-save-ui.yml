name: Optimize Save UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-save-ui.yml'

permissions:
  contents: write

jobs:
  patch-save-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch save handler
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = "    const { useState, useEffect, useMemo, useCallback } = React;"
          if "const { flushSync } = ReactDOM;" not in text:
              if text.count(marker) != 1:
                  raise SystemExit('React import marker not found exactly once')
              text = text.replace(marker, marker + "\n    const { flushSync } = ReactDOM;", 1)

          old = '''  // Beri browser satu frame untuk paint UI optimistis terlebih dahulu.\n  requestAnimationFrame(() => {\n    backendService.saveContent(currentUser, updated)\n      .then(() => {\n        showToast('Konten berhasil disimpan & KPI diperbarui!', 'success');\n\n        // Sync setelah request backend selesai, tanpa menahan render UI.\n        refreshData();\n      })\n      .catch((err) => {\n        showToast(err.message, 'error');\n        refreshData();\n      });\n  });'''

          new = '''  // Paksa React commit perubahan optimistis ke DOM sebelum request backend.\n  flushSync(() => {\n    setContentList(prev => {\n      const existingIndex = prev.findIndex(\n        item =>\n          item.content_id === updated.content_id ||\n          item.content_id === updated.contentId\n      );\n\n      if (existingIndex >= 0) {\n        const next = [...prev];\n        next[existingIndex] = optimisticContent;\n        return next;\n      }\n\n      return [optimisticContent, ...prev];\n    });\n  });\n\n  // Lepaskan request backend ke event loop setelah DOM sudah ter-commit.\n  setTimeout(() => {\n    backendService.saveContent(currentUser, updated)\n      .then(() => {\n        showToast('Konten berhasil disimpan & KPI diperbarui!', 'success');\n        refreshData();\n      })\n      .catch((err) => {\n        showToast(err.message, 'error');\n        refreshData();\n      });\n  }, 0);'''

          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one current save handler, found {text.count(old)}')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "perf: force synchronous optimistic save render"
          git push