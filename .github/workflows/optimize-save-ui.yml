name: Optimize Save UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-save-ui.yml'

permissions:
  contents: write

jobs:
  patch-save-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch bulk delete refresh
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = """          setHiddenIds([]);\n          await refreshData();\n          showToast('Content terpilih berhasil dihapus!', 'success');\n        } catch (err) {\n          setHiddenIds([]);\n          await refreshData();\n          showToast(err.message, 'error');\n        }"""

          new = """          showToast('Content terpilih berhasil dihapus!', 'success');\n          refreshData().finally(() => setHiddenIds([]));\n        } catch (err) {\n          setHiddenIds([]);\n          await refreshData();\n          showToast(err.message, 'error');\n        }"""

          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('bulk delete refresh block not found')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "perf: avoid blocking bulk delete on refresh"
          git push