  <style>
    * {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #e6ecf5;
      color: #1e293b;
      overflow-x: hidden;
    }

    /* Claymorphic Surface & Cards */
    .clay-surface {
      background: #f0f4f9;
      border-radius: 28px;
      box-shadow: 12px 12px 24px #cbd5e1, -12px -12px 24px #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .clay-card {
      background: #ffffff;
      border-radius: 22px;
      box-shadow: 8px 8px 16px #cbd5e1, -8px -8px 16px #ffffff,
                  inset 2px 2px 4px rgba(255, 255, 255, 0.9),
                  inset -2px -2px 4px rgba(0, 0, 0, 0.03);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
    }

    .clay-card-colored {
      border-radius: 22px;
      box-shadow: 8px 8px 16px rgba(148, 163, 184, 0.35),
                  -8px -8px 16px #ffffff,
                  inset 3px 3px 6px rgba(255, 255, 255, 0.5),
                  inset -3px -3px 6px rgba(0, 0, 0, 0.08);
    }

    /* Inset / Depressed Inputs */
    .clay-inset {
      background: #e2e8f0;
      border-radius: 16px;
      box-shadow: inset 4px 4px 8px #cbd5e1, inset -4px -4px 8px #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    /* Squishy & Bouncy Tactile Clay Buttons */
    .clay-btn {
      border-radius: 18px;
      box-shadow: 5px 5px 12px #cbd5e1, -5px -5px 12px #ffffff,
                  inset 2px 2px 3px rgba(255, 255, 255, 0.6),
                  inset -2px -2px 3px rgba(0, 0, 0, 0.06);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .clay-btn:hover {
      transform: translateY(-2px);
      box-shadow: 7px 7px 16px #cbd5e1, -7px -7px 16px #ffffff;
    }

    .clay-btn:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: inset 4px 4px 8px #cbd5e1, inset -4px -4px 8px #ffffff;
    }

    .clay-pill {
      border-radius: 9999px;
      box-shadow: 3px 3px 8px rgba(160, 175, 195, 0.3),
                  -3px -3px 8px #ffffff,
                  inset 1px 1px 2px rgba(255, 255, 255, 0.8),
                  inset -1px -1px 2px rgba(0, 0, 0, 0.05);
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #e2e8f0;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
  </style>
</head>

    const KPICalculationEngine = {
      calculateDeadlineCompliance(contentList) {
        const applicable = contentList.filter(c => c.actual_publish_date && c.publish_date);
        if (!applicable.length) return { actual: 100, target: 100, achieved: true, count: 0, total: 0, status: 'ON TRACK' };
        const onTime = applicable.filter(c => new Date(c.actual_publish_date) <= new Date(c.publish_date)).length;
        const percentage = Math.round((onTime / applicable.length) * 1000) / 10;
        return {
          actual: percentage,
          target: 100,
          achieved: percentage >= 100,
          count: onTime,
          total: applicable.length,
          status: percentage >= 100 ? 'ACHIEVED' : percentage >= 90 ? 'ON TRACK' : 'NEEDS ATTENTION'
        };
      },

      calculateH3SubmissionCompliance(contentList, h3DaysThreshold = 3) {
        const applicable = contentList.filter(c => c.submission_date && c.publish_date);
        if (!applicable.length) return { actual: 100, target: 100, achieved: true, count: 0, total: 0, status: 'ON TRACK' };
        const compliant = applicable.filter(c => {
          const pub = new Date(c.publish_date).getTime();
          const sub = new Date(c.submission_date).getTime();
          const diffDays = Math.round((pub - sub) / (1000 * 60 * 60 * 24));
          return diffDays >= h3DaysThreshold;
        }).length;
        const percentage = Math.round((compliant / applicable.length) * 1000) / 10;
        return {
          actual: percentage,
          target: 100,
          achieved: percentage >= 100,
          count: compliant,
          total: applicable.length,
          status: percentage >= 95 ? 'ACHIEVED' : percentage >= 85 ? 'ON TRACK' : 'NEEDS ATTENTION'
        };
      },

      calculateUnexpectedTaskCompliance(contentList, maxDays = 1) {
        const unexpected = contentList.filter(c => c.is_unexpected_task);
        if (!unexpected.length) return { actual: 100, count: 0, total: 0, status: 'ON TRACK', achieved: true };
        const completed = unexpected.filter(c => {
          if (!c.submission_date || !c.assigned_date) return false;
          const assigned = new Date(c.assigned_date).getTime();
          const submitted = new Date(c.submission_date).getTime();
          return Math.round((submitted - assigned) / (1000 * 60 * 60 * 24)) <= maxDays;
        }).length;
        const percentage = Math.round((completed / unexpected.length) * 100);
        return {
          actual: percentage,
          count: completed,
          total: unexpected.length,
          achieved: completed === unexpected.length,
          status: percentage === 100 ? 'ACHIEVED' : percentage >= 80 ? 'ON TRACK' : 'NEEDS ATTENTION'
        };
      },

      calculateMonthlyContentOutput(contentList, target = 35, includeStory = false) {
        const valid = contentList.filter(c => {
          if (!includeStory && c.content_type === 'Story') return false;
          return ['PUBLISHED', 'SCHEDULED', 'APPROVED'].includes(c.status);
        });
        const count = valid.length;
        const rawAchieve = Math.round((count / target) * 100);
        return {
          count,
          target,
          percentage: rawAchieve,
          achieved: count >= target,
          status: count >= target ? 'ACHIEVED' : count >= target * 0.8 ? 'ON TRACK' : 'NEEDS ATTENTION'
        };
      },

      calculateDailyStoryAverage(contentList, target = 8) {
        const stories = contentList.filter(c => c.content_type === 'Story');
        const dayMap = {};
        stories.forEach(s => { dayMap[s.publish_date] = (dayMap[s.publish_date] || 0) + 1; });
        const daysRecorded = Object.keys(dayMap).length || 1;
        const dailyAverage = Math.round((stories.length / daysRecorded) * 10) / 10;
        return {
          dailyAverage,
          target,
          totalStories: stories.length,
          achieved: dailyAverage >= target,
          status: dailyAverage >= target ? 'ACHIEVED' : dailyAverage >= target * 0.85 ? 'ON TRACK' : 'NEEDS ATTENTION'
        };
      },

      calculateOptimalReelsCoverRate(contentList) {
        const reels = contentList.filter(c => c.content_type === 'Reels');
        if (!reels.length) return { actual: 100, optimalCount: 0, totalReels: 0, achieved: true, status: 'ON TRACK' };
        const optimal = reels.filter(c => c.cover_status === 'OPTIMAL').length;
        const percentage = Math.round((optimal / reels.length) * 1000) / 10;
        return {
          actual: percentage,
          optimalCount: optimal,
          totalReels: reels.length,
          achieved: percentage >= 90,
          status: percentage >= 90 ? 'ACHIEVED' : percentage >= 75 ? 'ON TRACK' : 'NEEDS ATTENTION'
        };
      },

      calculate100KViewsCount(contentList, threshold = 100000, target = 3) {
        const hits = contentList.filter(c => (Number(c.views) || 0) >= threshold);
        const count = hits.length;
        return {
          count,
          target,
          percentage: Math.round((count / target) * 100),
          achieved: count >= target,
          status: count >= target ? 'ACHIEVED' : count >= 2 ? 'ON TRACK' : 'NEEDS ATTENTION',
          viralContents: hits
        };
      },

      calculateOverallKPI(metrics, weights = { process: 30, output: 40, outcome: 30 }) {
        const processScore = (Math.min(metrics.deadline.actual, 100) * 0.5) + (Math.min(metrics.h3.actual, 100) * 0.5);
        const contentScore = Math.min((metrics.contentOutput.count / metrics.contentOutput.target) * 100, 100);
        const storyScore = Math.min((metrics.stories.dailyAverage / metrics.stories.target) * 100, 100);
        const coverScore = Math.min(metrics.reelsCover.actual, 100);
        const outputScore = (contentScore * 0.4) + (storyScore * 0.3) + (coverScore * 0.3);
        const outcomeScore = Math.min((metrics.views100k.count / metrics.views100k.target) * 100, 100);

        const totalWeight = (weights.process || 30) + (weights.output || 40) + (weights.outcome || 30);
        const finalScore = Math.round(
          ((processScore * weights.process) + (outputScore * weights.output) + (outcomeScore * weights.outcome)) / totalWeight
        );

        let status = 'NEEDS ATTENTION';
        if (finalScore >= 90) status = 'ACHIEVED';
        else if (finalScore >= 75) status = 'ON TRACK';
        else if (finalScore >= 60) status = 'WARNING';

        return {
          score: finalScore,
          status,
          processScore: Math.round(processScore),
          outputScore: Math.round(outputScore),
          outcomeScore: Math.round(outcomeScore)
        };
      },

      evaluateCreator(contentList, config = INITIAL_CONFIG) {
        const deadline = this.calculateDeadlineCompliance(contentList);
        const h3 = this.calculateH3SubmissionCompliance(contentList, config.h3SubmissionDays);
        const unexpected = this.calculateUnexpectedTaskCompliance(contentList, config.unexpectedMaxDays);
        const contentOutput = this.calculateMonthlyContentOutput(contentList, config.monthlyContentTarget, config.includeStoryInContentCount);
        const stories = this.calculateDailyStoryAverage(contentList, config.dailyStoryTarget);
        const reelsCover = this.calculateOptimalReelsCoverRate(contentList);
        const views100k = this.calculate100KViewsCount(contentList, config.views100kThreshold, config.views100kTarget);

        const metrics = { deadline, h3, unexpected, contentOutput, stories, reelsCover, views100k };
        const overall = this.calculateOverallKPI(metrics, config.weights);
        return { ...metrics, overall };
      }
    };

  async _post(payload) {
    const response = await fetch(this.gasApiUrl, {

      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify({
  ...payload,

})
    });

    if (!response.ok) {

    }

    const data = await response.json();
console.log('LOGIN/API RESPONSE:', data);
    if (data.status === 'error') {
      throw new Error(data.message || 'Terjadi kesalahan pada API');
    }

    return data;

  async authenticate(email, password) {
    const data = await this._post({
      action: 'login',
      email,
      password
    });

    this.token = data.token;
    this.currentUser = data.user;

    return {
      token: data.token,
      user: data.user
    };
  }

  _authorize(currentUser, requiredRole = null) {
    const user = currentUser || this.currentUser;

    if (!user) {
      throw new Error('401 Unauthorized: Sesi tidak ditemukan');
    }

    if (requiredRole && user.role !== requiredRole) {
      throw new Error(
        `403 Forbidden: Akses khusus role ${requiredRole}`
      );
    }
  }

  async _loadData() {
    if (!this.token) {
      throw new Error('401 Unauthorized: Token tidak ditemukan');
    }

    const data = await this._post({
      action: 'getData',
      token: this.token
    });

    const result = data.data || {};

    this.users = result.users || [];
    this.content = result.content || [];
    this.config = Array.isArray(result.kpiConfig)
  ? {
      monthlyContentTarget: Number(result.kpiConfig.find(k => k.kpi_id === 'KPI001')?.target) || INITIAL_CONFIG.monthlyContentTarget,
      dailyStoryTarget: Number(result.kpiConfig.find(k => k.kpi_id === 'KPI002')?.target) || INITIAL_CONFIG.dailyStoryTarget,
      views100kTarget: Number(result.kpiConfig.find(k => k.kpi_id === 'KPI003')?.target) || INITIAL_CONFIG.views100kTarget,
      h3SubmissionDays: Number(result.kpiConfig.find(k => k.kpi_id === 'KPI004')?.target) || INITIAL_CONFIG.h3SubmissionDays,
      unexpectedMaxDays: Number(result.kpiConfig.find(k => k.kpi_id === 'KPI005')?.target) || INITIAL_CONFIG.unexpectedMaxDays,
      views100kThreshold: Number(result.kpiConfig.find(k => k.kpi_id === 'KPI006')?.target) || INITIAL_CONFIG.views100kThreshold,
      optimalReelsCoverRate: Number(result.kpiConfig.find(k => k.kpi_id === 'KPI007')?.target) || INITIAL_CONFIG.optimalReelsCoverRate,
      weights: {
        process: Number(result.kpiConfig.find(k => k.kpi_id === 'KPI008')?.target) || INITIAL_CONFIG.weights.process,
        output: Number(result.kpiConfig.find(k => k.kpi_id === 'KPI009')?.target) || INITIAL_CONFIG.weights.output,
        outcome: Number(result.kpiConfig.find(k => k.kpi_id === 'KPI010')?.target) || INITIAL_CONFIG.weights.outcome
      }
    }
  : result.kpiConfig || INITIAL_CONFIG;
    this.lastSynced = new Date();

    return result;
  }

  async getSharedCalendar(currentUser, filters = {}) {
    this._authorize(currentUser);

    const data = await this._loadData();

    let items = [...(data.content || [])];

    if (filters.month) {
      items = items.filter(
        c =>
          c.publish_date &&
          c.publish_date.startsWith(filters.month)
      );
    }

    if (filters.platform && filters.platform !== 'ALL') {
      items = items.filter(
        c => c.platform === filters.platform
      );
    }

    if (filters.type && filters.type !== 'ALL') {
      items = items.filter(
        c => c.content_type === filters.type
      );
    }

    if (filters.status && filters.status !== 'ALL') {
      items = items.filter(
        c => c.status === filters.status
      );
    }

    return items;
  }

  async getKPIDashboard(
    currentUser,
    targetCreatorId = null,
    filterMonth = '2026-09'
  ) {
    this._authorize(currentUser);

    const data = await this._loadData();

    let creatorIdToFetch = currentUser.user_id;

    if (currentUser.role === 'creative_director') {
      creatorIdToFetch =
        targetCreatorId || currentUser.user_id;
    } else {
      if (
        targetCreatorId &&
        targetCreatorId !== currentUser.user_id
      ) {
        throw new Error(
          '403 Forbidden: Content Creator dilarang mengakses KPI Creator lain!'
        );
      }
    }

    const scoped = (data.content || []).filter(c => {
      const matchCreator =
        c.creator_id === creatorIdToFetch;

      const matchMonth = filterMonth
        ? c.publish_date &&
          c.publish_date.startsWith(filterMonth)
        : true;

      return matchCreator && matchMonth;
    });

    const creatorUser = (data.users || []).find(
      u => u.user_id === creatorIdToFetch
    );

    const config =
      Object.keys(data.kpiConfig || {}).length
        ? data.kpiConfig
        : INITIAL_CONFIG;

    const calculation =
      KPICalculationEngine.evaluateCreator(
        scoped,
        config
      );

    return {
      creator: creatorUser,
      period: filterMonth,
      metrics: calculation,
      totalContentCount: scoped.length
    };
  }

  async getTeamKPIOverview(
    currentUser,
    filterMonth = '2026-09'
  ) {
    this._authorize(
      currentUser,
      'creative_director'
    );

    const data = await this._loadData();

    const config =
      Object.keys(data.kpiConfig || {}).length
        ? data.kpiConfig
        : INITIAL_CONFIG;

    const scoped = (data.content || []).filter(
      c =>
        filterMonth
          ? c.publish_date &&
            c.publish_date.startsWith(filterMonth)
          : true
    );

    const creators = (data.users || []).filter(
      u => u.role === 'content_creator'
    );

    const creatorBreakdown = creators.map(
      creator => {
        const items = scoped.filter(
          c => c.creator_id === creator.user_id
        );

        const evalData =
          KPICalculationEngine.evaluateCreator(
            items,
            config
          );

        return {
          creator,

          contentCount:
            evalData.contentOutput.count,

          targetContent:
            evalData.contentOutput.target,

          deadlineCompliance:
            evalData.deadline.actual,

          h3Compliance:
            evalData.h3.actual,

          dailyStory:
            evalData.stories.dailyAverage,

          coverOptimalRate:
            evalData.reelsCover.actual,

          views100kHits:
            evalData.views100k.count,

          overallScore:
            evalData.overall.score,

          status:
            evalData.overall.status
        };
      }
    );

    return {
      period: filterMonth,
      totalContent: scoped.length,

      teamDeadline:
        KPICalculationEngine.calculateDeadlineCompliance(
          scoped
        ),

      teamH3:
        KPICalculationEngine.calculateH3SubmissionCompliance(
          scoped,
          config.h3SubmissionDays
        ),

      teamStories:
        scoped.filter(
          c => c.content_type === 'Story'
        ).length,

      team100k:
        scoped.filter(
          c => (Number(c.views) || 0) >=
            config.views100kThreshold
        ).length,

      teamCovers:
        KPICalculationEngine.calculateOptimalReelsCoverRate(
          scoped
        ),

      creatorBreakdown
    };
  }

            alerts.push({
              title: `${cb.creator.name} Missed Deadline`,
              desc: `Tingkat kepatuhan waktu saat ini ${cb.deadlineCompliance}%.`,

    function ClayContentCalendar({ contentList, onSelectContent, onCreateNew }) {
      const [filterPlatform, setFilterPlatform] = useState('ALL');
      const [filterType, setFilterType] = useState('ALL');
      const [search, setSearch] = useState('');

      const filtered = useMemo(() => {
        return contentList.filter(c => {
          const matchP = filterPlatform === 'ALL' || c.platform === filterPlatform;
          const matchT = filterType === 'ALL' || c.content_type === filterType;
          const matchS = !search || c.content_title.toLowerCase().includes(search.toLowerCase()) || c.creator_name.toLowerCase().includes(search.toLowerCase());
          return matchP && matchT && matchS;
        });
      }, [contentList, filterPlatform, filterType, search]);

      const daysInMonth = 30;
      const startOffset = 2;
      const cells = [];
      for (let i = 0; i < startOffset; i++) cells.push({ blank: true, key: `b-${i}` });
      for (let d = 1; d <= daysInMonth; d++) {
        const dStr = `2026-09-${String(d).padStart(2, '0')}`;
        cells.push({ blank: false, day: d, dateStr: dStr, items: filtered.filter(c => c.publish_date === dStr), key: `d-${d}` });
      }

      return (
        <div className="space-y-5">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h2 className="text-xl font-extrabold text-slate-900">Shared Content Calendar</h2>
              <p className="text-xs text-slate-500 font-medium">Jadwal transparan tim untuk melihat slot publikasi.</p>
            </div>
            <button
              onClick={() => onCreateNew()}
              className="clay-btn bg-gradient-to-r from-indigo-500 to-purple-600 text-white text-xs font-bold px-4 py-2.5 flex items-center space-x-1.5 self-start"
            >
              <Icon.Plus />
              <span>Tambah Jadwal</span>
            </button>
          </div>

          <div className="clay-surface p-3 flex flex-wrap items-center justify-between gap-3 text-xs">
            <div className="flex items-center space-x-2 flex-1 min-w-[200px] clay-inset px-3 py-2">
              <span className="text-slate-400"><Icon.Search /></span>
              <input
                type="text"
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                placeholder="Cari judul konten atau creator..."
                className="w-full bg-transparent text-slate-800 font-medium focus:outline-none placeholder-slate-400"
              />
            </div>

            <div className="flex items-center space-x-2">
              <select
                value={filterPlatform}
                onChange={(e) => setFilterPlatform(e.target.value)}
                className="clay-inset px-3 py-2 text-slate-800 font-bold focus:outline-none cursor-pointer"
              >
                <option value="ALL">Semua Platform</option>
                <option value="Instagram">Instagram</option>
                <option value="TikTok">TikTok</option>
                <option value="YouTube Shorts">YouTube Shorts</option>
              </select>

              <select
                value={filterType}
                onChange={(e) => setFilterType(e.target.value)}
                className="clay-inset px-3 py-2 text-slate-800 font-bold focus:outline-none cursor-pointer"
              >
                <option value="ALL">Semua Format</option>
                <option value="Reels">Reels</option>
                <option value="Carousel">Carousel</option>
                <option value="Story">Story</option>
                <option value="Video">Video</option>
              </select>
            </div>
          </div>

          <div className="clay-surface p-4 overflow-hidden">
            <div className="grid grid-cols-7 text-center text-[11px] font-extrabold text-slate-400 uppercase tracking-wider py-2 mb-2 border-b border-slate-200">
              <div>Min</div><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div>
            </div>

            <div className="grid grid-cols-7 gap-2">
              {cells.map((cell) => {
                if (cell.blank) return <div key={cell.key} className="min-h-[100px] opacity-20" />;
                return (
                  <div
                    key={cell.key}
                    onClick={() => onCreateNew(cell.dateStr)}
                    className="min-h-[100px] clay-card p-2 hover:bg-indigo-50/50 cursor-pointer transition flex flex-col justify-between"
                  >
                    <div className="flex justify-between text-xs font-black text-slate-700">
                      <span>{cell.day}</span>
                      {cell.items.length > 0 && (
                        <span className="text-[9px] font-bold px-1.5 py-0.2 clay-pill bg-indigo-100 text-indigo-700">
                          {cell.items.length}
                        </span>
                      )}
                    </div>

                    <div className="space-y-1 overflow-y-auto max-h-[70px]">
                      {cell.items.map((item) => (
                        <div
                          key={item.content_id}
                          onClick={(e) => { e.stopPropagation(); onSelectContent(item); }}
                          className={`p-1 rounded-xl text-[9px] font-bold truncate border shadow-xs ${STATUS_BADGE[item.status]}`}
                          title={item.content_title}
                        >
                          {item.content_title}
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

                    {stat && (
                      <div className="flex items-center space-x-2 mt-2">
                        <span className="text-[10px] font-bold px-2 py-0.5 clay-pill bg-indigo-50 text-indigo-700">
                          Skor: {stat.overallScore}%
                        </span>
                        <span className="text-[10px] font-bold px-2 py-0.5 clay-pill bg-teal-50 text-teal-700">
                          {stat.contentCount}/{stat.targetContent} Konten
                        </span>
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function ClaySettingsView({ config, onSave }) {
      const [form, setForm] = useState({ ...config });
      return (
        <div className="clay-surface p-6 max-w-2xl space-y-6">
          <h2 className="text-xl font-extrabold text-slate-900">Konfigurasi Target & Bobot KPI</h2>
          <div className="grid grid-cols-2 gap-4 text-xs font-bold text-slate-700">
            <div>
              <label className="block mb-1">Target Konten Bulanan</label>
              <input type="number" value={form.monthlyContentTarget} onChange={(e) => setForm({ ...form, monthlyContentTarget: Number(e.target.value) })} className="w-full clay-inset p-2.5" />
            </div>
            <div>
              <label className="block mb-1">Target Story Harian</label>
              <input type="number" value={form.dailyStoryTarget} onChange={(e) => setForm({ ...form, dailyStoryTarget: Number(e.target.value) })} className="w-full clay-inset p-2.5" />
            </div>
          </div>
          <button onClick={() => onSave(form)} className="w-full clay-btn bg-indigo-600 text-white font-bold py-3 text-xs">
            Simpan & Hitung Ulang Semua KPI
          </button>
        </div>
      );
    }

    function ClayProfileSpecs({ user, config }) {
      return (
        <div className="clay-surface p-6 max-w-xl space-y-4">
          <div className="flex items-center space-x-4">
            <img src={user.avatar} alt={user.name} className="w-14 h-14 rounded-2xl object-cover shadow-sm" />
            <div>
              <h2 className="text-lg font-extrabold text-slate-900">{user.name}</h2>
              <p className="text-xs text-slate-500">{user.email}</p>
              <span className="text-[10px] font-bold px-2 py-0.5 clay-pill bg-indigo-100 text-indigo-700 mt-1 inline-block">
                {user.role}
              </span>
            </div>
          </div>
        </div>
      );
    }

    function ClayContentModal({ content, currentUser, users, onClose, onSave }) {
      const [formData, setFormData] = useState({ ...content });
      const isDirector = currentUser.role === 'creative_director';

      return (
        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
          <div className="clay-surface bg-white max-w-xl w-full p-6 space-y-4 my-8">
            <div className="flex items-center justify-between pb-3 border-b border-slate-200">
              <h3 className="text-base font-extrabold text-slate-900">
                {formData.content_id ? `Tugas #${formData.content_id}` : 'Buat Konten Baru'}
              </h3>
              <button onClick={onClose} className="clay-btn p-1.5 text-slate-400 hover:text-slate-800">
                <Icon.Close />
              </button>
            </div>

            <div className="space-y-3 text-xs font-bold text-slate-700">
              <div>
                <label className="block mb-1">Judul Konten</label>
                <input type="text" value={formData.content_title} onChange={(e) => setFormData({ ...formData, content_title: e.target.value })} className="w-full clay-inset p-2.5 font-medium text-slate-900" />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block mb-1">Format</label>
                  <select value={formData.content_type} onChange={(e) => setFormData({ ...formData, content_type: e.target.value })} className="w-full clay-inset p-2.5">
                    <option value="Reels">Reels</option>
                    <option value="Carousel">Carousel</option>
                    <option value="Single Post">Single Post</option>
                    <option value="Story">Story</option>
                  </select>
                </div>
                <div>
                  <label className="block mb-1">Status</label>
                  <select value={formData.status} onChange={(e) => setFormData({ ...formData, status: e.target.value })} className="w-full clay-inset p-2.5">
                    <option value="IN PRODUCTION">In Production</option>
                    <option value="SUBMITTED">Submitted</option>
                    <option value="APPROVED">Approved</option>
                    <option value="PUBLISHED">Published</option>
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block mb-1">Tanggal Rilis</label>
                  <input type="date" value={formData.publish_date || ''} onChange={(e) => setFormData({ ...formData, publish_date: e.target.value })} className="w-full clay-inset p-2.5 font-medium" />
                </div>
                <div>
                  <label className="block mb-1">Views (Recalculates KPI)</label>
                  <input type="number" value={formData.views || 0} onChange={(e) => setFormData({ ...formData, views: Number(e.target.value) })} className="w-full clay-inset p-2.5 font-medium text-indigo-600 font-mono" />
                </div>
              </div>
            </div>

            <div className="flex justify-end space-x-2 pt-3 border-t border-slate-200">
              <button onClick={onClose} className="clay-btn bg-slate-100 px-4 py-2 text-xs font-bold text-slate-600">Batal</button>
              <button onClick={() => onSave(formData)} className="clay-btn bg-indigo-600 px-5 py-2 text-xs font-bold text-white">Simpan Perubahan</button>
            </div>
          </div>
        </div>
      );
    }

    function ClayKPIMiniCard({ label, value, subtext, status }) {
      return (
        <div className="clay-surface p-3.5 flex flex-col justify-between">
          <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">{label}</span>
          <div className="my-1.5">
            <div className="text-lg font-black text-slate-900">{value}</div>
            <div className="text-[10px] text-slate-500 font-medium">{subtext}</div>
          </div>
          <span className={`text-[9px] font-extrabold px-2 py-0.5 clay-pill text-center ${KPI_BADGE[status] || 'bg-slate-100 text-slate-600'}`}>
            {status}
          </span>
        </div>
      );
    }

    function ClayKPIDetailCard({ title, actual, target, status, subtitle, desc }) {
      return (
        <div className="clay-surface p-4 flex flex-col justify-between space-y-2">
          <div>
            <div className="flex items-center justify-between mb-1">
              <h4 className="text-xs font-extrabold text-slate-900">{title}</h4>
              <span className={`px-2 py-0.5 clay-pill text-[9px] font-extrabold ${KPI_BADGE[status]}`}>{status}</span>
            </div>
            <div className="flex items-baseline space-x-2">
              <span className="text-2xl font-black text-slate-900">{actual}</span>
              <span className="text-xs font-bold text-slate-400">Target: {target}</span>
            </div>
            <div className="text-[11px] font-bold text-indigo-600 mt-0.5">{subtitle}</div>
          </div>
          <p className="text-[10px] text-slate-500 font-medium pt-2 border-t border-slate-200 leading-relaxed">{desc}</p>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
